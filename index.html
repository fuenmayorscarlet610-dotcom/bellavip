<!-- Sección del Video de Alto Impacto -->
<section class="section">
    <div class="section-title">Vista Previa Exclusiva</div>
    
    <div class="video-preview-wrapper">
        <video id="promoVideo" class="custom-video" poster="tu-miniatur-o-portada.jpg" playsinline loop>
            <source src="tu-video.mp4" type="video/mp4">
            Tu navegador no soporta el formato de video.
        </video>
        
        <!-- Overlay táctico con botón de reproducción -->
        <div class="video-overlay" id="videoOverlay" onclick="toggleMainVideo()">
            <div class="play-trigger">
                <span class="play-icon">▶</span>
            </div>
            <div class="video-tag">PREVIEW • UNCUT</div>
        </div>
    </div>
</section>

<style>
    /* Estilos del Reproductor Exclusivo */
    .video-preview-wrapper {
        position: relative;
        width: 100%;
        max-width: 320px;
        margin: 0 auto;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid var(--neon-pink);
        box-shadow: 0 0 25px rgba(255, 0, 85, 0.35), inset 0 0 15px rgba(0, 0, 0, 0.8);
        background: #000;
        aspect-ratio: 9 / 16; /* Mantener formato vertical impecable */
    }

    .custom-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .video-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(5, 3, 8, 0.4);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: background 0.3s ease;
    }

    .video-overlay.playing {
        background: rgba(0, 0, 0, 0); /* Transparente al reproducir */
    }

    .play-trigger {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(12, 8, 20, 0.8);
        border: 2px solid var(--neon-pink);
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
        transition: transform 0.2s ease;
    }

    .play-icon {
        color: #fff;
        font-size: 1.2rem;
        margin-left: 3px;
    }

    .video-overlay.playing .play-trigger {
        opacity: 0;
        transform: scale(0.8);
        pointer-events: none;
    }

    .video-tag {
        position: absolute;
        top: 12px;
        left: 12px;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid var(--neon-cyan);
        color: var(--neon-cyan);
        font-family: 'Orbitron', sans-serif;
        font-size: 0.6rem;
        padding: 4px 8px;
        border-radius: 4px;
        letter-spacing: 1px;
    }
</style>

<script>
    // Lógica para pausar el audio de fondo cuando el video se reproduzca
    const mainVideo = document.getElementById('promoVideo');
    const videoOverlay = document.getElementById('videoOverlay');
    const bgAudio = document.getElementById('bgm'); // ID de tu música de fondo
    const playBtn = document.getElementById('playBtn');
    const audioStatus = document.getElementById('audioStatus');
    const eqBars = document.getElementById('eqBars');

    function toggleMainVideo() {
        if (mainVideo.paused) {
            // Pausar música de fondo si está sonando
            if (bgAudio && !bgAudio.paused) {
                bgAudio.pause();
                if (playBtn) playBtn.innerText = '▶';
                if (audioStatus) audioStatus.innerText = 'AUDIO: PAUSADO';
                if (eqBars) eqBars.classList.remove('playing');
            }
            
            mainVideo.play();
            videoOverlay.classList.add('playing');
        } else {
            mainVideo.pause();
            videoOverlay.classList.remove('playing');
        }
    }

    // Si el video termina, quita el overlay
    mainVideo.addEventListener('ended', () => {
        videoOverlay.classList.remove('playing');
    });
                    </script>

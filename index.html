<script>
    const mainVideo = document.getElementById('promoVideo');
    const videoOverlay = document.getElementById('videoOverlay');
    const bgAudio = document.getElementById('bgm');

    function toggleMainVideo() {
        if (mainVideo.paused) {
            if (bgAudio && !bgAudio.paused) {
                bgAudio.pause();
            }
            mainVideo.play();
            videoOverlay.classList.add('playing');
        } else {
            mainVideo.pause();
            videoOverlay.classList.remove('playing');
        }
    }

    mainVideo.addEventListener('ended', () => {
        videoOverlay.classList.remove('playing');
    });
</script>
